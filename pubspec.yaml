name: flutter_project
description: "A modern notes app with Firebase backend."
publish_to: "none"
version: 1.0.0

environment:
  sdk: ^3.5.4

dependencies:
  flutter:
    sdk: flutter
  
  # Firebase dependencies
  firebase_core: ^3.6.0
  cloud_firestore: ^5.4.4
  firebase_auth: ^5.3.1
  
  # State management
  provider: ^6.1.2
  
  # UI dependencies
  google_fonts: ^6.2.1
  intl: ^0.19.0
  flutter_slidable: ^3.1.1
  flutter_staggered_grid_view: ^0.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
